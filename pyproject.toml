[project]
name = "mentor"
version = "0.3.1"
description = "Teach agents how to do stuff by turning documentation into Agent Skills"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "urllib3<2; python_version < '3.10'",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
enhance = ["anthropic>=0.25"]
dev = ["pytest>=7.4"]

[project.scripts]
mentor = "doctoskill.cli:main"
doctoskill = "doctoskill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mentor*", "doctoskill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
