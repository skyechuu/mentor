[project]
name = "doctoskill"
version = "0.2.1"
description = "Convert a documentation website into a vendor-neutral Agent Skill"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "urllib3<2; python_version < '3.10'",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
enhance = ["anthropic>=0.25"]
dev = ["pytest>=7.4"]

[project.scripts]
doctoskill = "doctoskill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doctoskill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
